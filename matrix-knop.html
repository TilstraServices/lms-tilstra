<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Inter, sans-serif;
        display: flex;
        align-items: center;
        padding: 8px 0;
      }
      .knop {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        background: #2e7d32;
        color: #fff;
        border: none;
        border-radius: 50px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        font-family: Inter, sans-serif;
        transition: background 0.2s;
      }
      .knop:hover {
        background: #1b5e20;
      }
    </style>
  </head>
  <body>
    <button class="knop" onclick="stuurBericht()">
      📋 Open Competentiematrix
    </button>
    <script>
      function stuurBericht() {
        window.parent.postMessage({ type: "openMatrix" }, "*");
      }
    </script>
  </body>
</html>
