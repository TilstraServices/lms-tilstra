<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open vraag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --lms-bg: #f0f2f5;
        --lms-surface: #ffffff;
        --lms-green: #2e7d32;
        --lms-green-mid: #43a047;
        --lms-green-light: #e8f5e9;
        --lms-text: #1a1a1a;
        --lms-text-muted: #5f6368;
        --lms-border: #dadce0;
        --lms-radius: 8px;
        --lms-correct: #2e7d32;
        --lms-correct-bg: #e8f5e9;
        --lms-error: #c62828;
        --lms-error-bg: #ffebee;
      }
      html,
      body {
        background: transparent;
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        color: var(--lms-text);
        font-size: 15px;
        line-height: 1.7;
      }
      .exercise {
        background: var(--lms-surface);
        border: 1px solid var(--lms-border);
        border-radius: var(--lms-radius);
        padding: 1.75rem 2rem;
      }
      .exercise-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--lms-text);
        margin-bottom: 1.25rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--lms-border);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .exercise-title::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 18px;
        background: var(--lms-green);
        border-radius: 2px;
        flex-shrink: 0;
      }
      .antwoord-veld {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--lms-border);
        border-radius: var(--lms-radius);
        background: var(--lms-bg);
        font-family: inherit;
        font-size: 14px;
        color: var(--lms-text);
        resize: vertical;
        min-height: 100px;
        transition:
          border-color 0.12s,
          background 0.12s;
        outline: none;
        margin-bottom: 1.25rem;
      }
      .antwoord-veld:focus {
        border-color: var(--lms-green-mid);
        background: var(--lms-green-light);
      }
      .antwoord-veld.correct {
        border-color: var(--lms-correct);
        background: var(--lms-correct-bg);
        color: var(--lms-correct);
        font-weight: 500;
      }
      .antwoord-veld.incorrect {
        border-color: var(--lms-error);
        background: var(--lms-error-bg);
        color: var(--lms-error);
      }
      .antwoord-veld:disabled {
        cursor: default;
      }
      .modelantwoord-blok {
        display: none;
        padding: 12px 14px;
        background: var(--lms-correct-bg);
        border: 1px solid #a5d6a7;
        border-radius: var(--lms-radius);
        font-size: 13.5px;
        color: var(--lms-correct);
        font-weight: 500;
        margin-bottom: 1.25rem;
      }
      .modelantwoord-blok.zichtbaar {
        display: block;
      }
      .modelantwoord-blok span {
        font-weight: 400;
        color: var(--lms-text);
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 8px 20px;
        border-radius: 100px;
        border: none;
        cursor: pointer;
        transition: background 0.12s;
      }
      .btn-secondary {
        background: transparent;
        color: var(--lms-text-muted);
        border: 1px solid var(--lms-border);
      }
      .btn-secondary:hover {
        background: #f1f3f4;
        color: var(--lms-text);
      }
      .btn-hint {
        background: #fff8e1;
        color: #e65100;
        border: 1px solid #ffd54f;
        display: none;
      }
      .btn-hint:hover {
        background: #fff3cd;
      }
      .feedback {
        margin-top: 1rem;
        padding: 10px 14px;
        border-radius: var(--lms-radius);
        font-size: 13.5px;
        font-weight: 500;
        display: none;
        align-items: center;
        gap: 8px;
      }
      .feedback.success {
        display: flex;
        background: var(--lms-correct-bg);
        color: var(--lms-correct);
        border: 1px solid #a5d6a7;
      }
      .feedback.wrong {
        display: flex;
        background: var(--lms-error-bg);
        color: var(--lms-error);
        border: 1px solid #ef9a9a;
      }
      .feedback.neutraal {
        display: flex;
        background: #f5f5f5;
        color: #5f6368;
        border: 1px solid #e0e0e0;
      }
      .laden {
        padding: 2rem;
        text-align: center;
        color: var(--lms-text-muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="laden">Opgave laden...</div></div>

    <script>
      const SUPABASE_URL = "https://jgycmakaugasithuszlc.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpneWNtYWthdWdhc2l0aHVzemxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4Mjg1MjcsImV4cCI6MjA5NDQwNDUyN30.egxFASu1eRM1fH-zeAhM8ibXdP0Koc5JedpsX-d7j2A";
      const { createClient } = supabase;
      const db = createClient(SUPABASE_URL, SUPABASE_KEY);

      const params = new URLSearchParams(window.location.search);
      const opgaveId = params.get("id");

      let gecontroleerd = false;
      let opgaveData = null;

      async function laadOpgave() {
        if (!opgaveId) {
          document.getElementById("root").innerHTML =
            '<div class="laden">Geen opgave ID opgegeven.</div>';
          return;
        }
        const { data, error } = await db
          .from("opgaves")
          .select("*")
          .eq("id", opgaveId)
          .single();
        if (error || !data) {
          document.getElementById("root").innerHTML =
            '<div class="laden">Opgave niet gevonden.</div>';
          return;
        }
        opgaveData = data;
        bouwOpgave(data.inhoud);
      }

      function bouwOpgave(inhoud) {
        const root = document.getElementById("root");
        root.innerHTML = `
          <div class="exercise">
            <div class="exercise-title">${inhoud.vraag}</div>
            <textarea
              class="antwoord-veld"
              id="antwoord"
              placeholder="Typ hier je antwoord..."
              autocomplete="off"
              spellcheck="false"
            ></textarea>
            <div class="modelantwoord-blok" id="modelantwoord">
              ✓ Correct antwoord: <span id="modelantwoord-tekst"></span>
            </div>
            <div class="actions">
              <button class="btn btn-secondary" id="btnOpnieuw">Opnieuw</button>
              <button class="btn btn-hint" id="btnToonAntwoord">Toon Antwoord</button>
            </div>
            <div class="feedback" id="feedback">
              <span id="feedbackIcon"></span>
              <span id="feedbackText"></span>
            </div>
          </div>
        `;

        document
          .getElementById("btnOpnieuw")
          .addEventListener("click", opnieuw);
        document
          .getElementById("btnToonAntwoord")
          .addEventListener("click", toonAntwoord);
      }

      function normaliseer(tekst) {
        return tekst.trim().toLowerCase().replace(/\s+/g, " ");
      }

      function controleer() {
        if (gecontroleerd || !opgaveData) return 0;
        gecontroleerd = true;

        const invoerWaarde = document.getElementById("antwoord").value.trim();
        if (!invoerWaarde) {
          const feedback = document.getElementById("feedback");
          feedback.className = "feedback neutraal";
          document.getElementById("feedbackIcon").textContent = "○";
          document.getElementById("feedbackText").textContent =
            "Deze opgave is leeg opgeslagen, vul een antwoord in.";
          return 0;
        }

        const invoer = normaliseer(document.getElementById("antwoord").value);
        const modelantwoorden =
          opgaveData.inhoud.modelantwoorden.map(normaliseer);
        const isCorrect = modelantwoorden.includes(invoer);
        const score = isCorrect ? 100 : 0;

        const antwoordVeld = document.getElementById("antwoord");
        antwoordVeld.disabled = true;
        antwoordVeld.classList.add(isCorrect ? "correct" : "incorrect");

        const feedback = document.getElementById("feedback");
        feedback.className = "feedback";

        if (isCorrect) {
          feedback.classList.add("success");
          document.getElementById("feedbackIcon").textContent = "✓";
          document.getElementById("feedbackText").textContent = "Correct!";
        } else {
          feedback.classList.add("wrong");
          document.getElementById("feedbackIcon").textContent = "✕";
          document.getElementById("feedbackText").textContent =
            "Niet correct. Probeer opnieuw of toon het antwoord.";
          document.getElementById("btnToonAntwoord").style.display =
            "inline-block";
        }

        window.parent.postMessage(
          { type: "opgave_score", opgave_id: opgaveId, score: score },
          "*",
        );
        return score;
      }

      function toonAntwoord() {
        const modelantwoorden = opgaveData.inhoud.modelantwoorden;
        document.getElementById("modelantwoord-tekst").textContent =
          modelantwoorden.join(" / ");
        document.getElementById("modelantwoord").classList.add("zichtbaar");
        document.getElementById("btnToonAntwoord").style.display = "none";
      }

      function opnieuw() {
        if (!opgaveData) return;
        gecontroleerd = false;

        const antwoordVeld = document.getElementById("antwoord");
        antwoordVeld.value = "";
        antwoordVeld.disabled = false;
        antwoordVeld.classList.remove("correct", "incorrect");

        document.getElementById("feedback").className = "feedback";
        document.getElementById("modelantwoord").classList.remove("zichtbaar");
        document.getElementById("btnToonAntwoord").style.display = "none";

        window.parent.postMessage(
          { type: "opgave_reset", opgave_id: opgaveId },
          "*",
        );
      }

      function reset() {
        opnieuw();
      }

      window.addEventListener("message", (event) => {
        if (event.data.type === "controleer") controleer();
        if (event.data.type === "reset") reset();
      });

      laadOpgave();

      function stuurHoogte() {
        window.parent.postMessage(
          { type: "iframe_hoogte", hoogte: document.body.scrollHeight },
          "*",
        );
      }
      window.addEventListener("load", stuurHoogte);
      new ResizeObserver(stuurHoogte).observe(document.body);
    </script>
  </body>
</html>
